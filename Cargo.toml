[package]
name = "tool1"
version = "0.1.0"
edition = "2024"

[dependencies]
macroquad = "0.4"
image = "0.24.9"

# macOS: talk to AppKit (system color sampler, window level)
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
block = "0.1"
[build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
